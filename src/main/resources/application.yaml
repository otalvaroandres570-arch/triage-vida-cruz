server:
  port: 8081

spring:
  application:
    name: triage-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triage_db}
    username: ${DB_USER:triage_user}
    password: ${DB_PASSWORD}

  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triage_db}
    user: ${DB_USER:triage_user}
    password: ${DB_PASSWORD}
