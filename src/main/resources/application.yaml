server:
  port: 8081

spring:
  application:
    name: triage-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triage_db}
    username: ${DB_USER:triage_user}
    password: ${DB_PASSWORD}

  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triage_db}
    user: ${DB_USER:triage_user}
    password: ${DB_PASSWORD}


# Optional SLA overrides in minutes (defaults per business rule RN-02: 5 / 10 / 30 / 60 / 120).
# Useful to test escalation without waiting. Can also be set via environment variables,
# e.g. TRIAGE_SLA_CRITICO=1
# triage:
#   sla:
#     critico: 5
#     urgente: 10
#     urgente2: 30
#     no-urgente: 60
#     no-urgente2: 120


# Kafka event publishing. Defaults match the docker compose in vidacruz-platform.
# triage:
#   kafka:
#     bootstrap-servers: localhost:9092   # env: TRIAGE_KAFKA_BOOTSTRAP_SERVERS
#     topic: triaje.eventos               # env: TRIAGE_KAFKA_TOPIC


# Outbox relay: publishes pending events to Kafka in order.
# triage:
#   outbox:
#     relay:
#       enabled: true      # env: TRIAGE_OUTBOX_RELAY_ENABLED
#       interval: 1s       # env: TRIAGE_OUTBOX_RELAY_INTERVAL
#       batch-size: 100    # env: TRIAGE_OUTBOX_RELAY_BATCH_SIZE


# SLA monitor: escalates patients still waiting after their SLA expired.
# triage:
#   sla-monitor:
#     enabled: true      # env: TRIAGE_SLAMONITOR_ENABLED
#     interval: 10s      # env: TRIAGE_SLAMONITOR_INTERVAL
#     batch-size: 100    # env: TRIAGE_SLAMONITOR_BATCHSIZE


# Escalation alerts: durable queue and dispatcher with retries.
# triage:
#   alerts:
#     enabled: true      # env: TRIAGE_ALERTS_ENABLED
#     interval: 5s       # env: TRIAGE_ALERTS_INTERVAL
#     batch-size: 20     # env: TRIAGE_ALERTS_BATCHSIZE
#     lease: 60s         # env: TRIAGE_ALERTS_LEASE
#     retry-base: 5s     # env: TRIAGE_ALERTS_RETRYBASE
#     retry-max: 5m      # env: TRIAGE_ALERTS_RETRYMAX

#     webhook-url:       # env: TRIAGE_ALERTS_WEBHOOK_URL (secret; if empty the alerts only go to the log)
#     webhook-timeout: 5s   # env: TRIAGE_ALERTS_WEBHOOKTIMEOUT


# API key authentication. Secure by default: the service refuses to start without a key of 16+ characters.
# triage:
#   security:
#     api-keys: ${...}   # env: TRIAGE_SECURITY_APIKEYS (secret; comma-separated to rotate keys without downtime)
#     enabled: true      # only ever false in automated tests